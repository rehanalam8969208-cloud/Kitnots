<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Life Notes</title>
<style>
  :root {
    --bg-base: #06070a;
    --card-color: #ffffff;
    --card-alpha: 0.08;
    --glass-blur: 24px;
    --border-color: #ffffff;
    --border-alpha: 0.16;
    --radius: 26px;

    --text-primary: #ffffff;
    --text-secondary: #a1a1aa;

    --btn-bg: transparent;
    --btn-border: rgba(255, 255, 255, 0.22);
    --btn-text: #ffffff;
    --btn-active-bg: #ffffff;
    --btn-active-text: #06070a;

    --success: #34d399;
    --danger: #f87171;

    --ease-float: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-silk: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  .wallpaper-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(255, 255, 255, 0.06) 0%, transparent 45%),
      var(--bg-base);
    pointer-events: none;
  }

  .wallpaper-dim {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }

  button, input, textarea {
    font-family: inherit;
    touch-action: manipulation;
    transition: transform 0.32s var(--ease-float), background 0.28s var(--ease-silk), color 0.28s var(--ease-silk), border-color 0.28s var(--ease-silk), opacity 0.28s var(--ease-silk);
  }

  button:active {
    transform: scale(0.96);
  }

  /* FULL SCREEN APP SHELL */
  .app-shell {
    width: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 16px);
    padding-bottom: env(safe-area-inset-bottom, 14px);
    position: relative;
  }

  .view {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .view.active {
    display: flex;
    animation: a17FloatView 0.48s var(--ease-float) both;
  }

  @keyframes a17FloatView {
    0% {
      opacity: 0;
      transform: translateY(12px) scale(0.99);
      filter: blur(4px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
  }

  /* EDITOR FULLSCREEN LAYOUT */
  .editor-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
  }

  .pill-btn {
    background: color-mix(in srgb, var(--card-color) calc(var(--card-alpha) * 100%), transparent);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    padding: 9px 15px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(var(--glass-blur));
    white-space: nowrap;
  }

  .pill-btn.save-btn {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
    font-weight: 700;
  }

  .status-chip {
    font-size: 11.5px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    text-align: center;
  }

  .editor-title-wrap {
    padding: 4px 16px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .title-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .title-input::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }

  .editor-body-wrap {
    flex: 1;
    min-height: 0;
    padding: 12px 16px 14px;
    display: flex;
  }

  .note-textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-size: 15.5px;
    line-height: 1.6;
    -webkit-user-select: text;
    user-select: text;
  }

  .note-textarea::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }

  /* NOTES LIST VIEW */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 10px;
    gap: 10px;
  }

  .list-header h1 {
    font-size: 21px;
    font-weight: 700;
  }

  .list-header p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .search-wrap {
    padding: 0 16px 10px;
  }

  .search-input {
    width: 100%;
    background: color-mix(in srgb, var(--card-color) calc(var(--card-alpha) * 100%), transparent);
    border: 1px solid var(--btn-border);
    border-radius: 16px;
    padding: 11px 14px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(var(--glass-blur));
  }

  .notes-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-user-select: none;
    user-select: none;
  }

  .note-card {
    background: color-mix(in srgb, var(--card-color) calc(var(--card-alpha) * 100%), transparent);
    border: 1px solid color-mix(in srgb, var(--border-color) calc(var(--border-alpha) * 100%), transparent);
    border-radius: 20px;
    padding: 14px 16px;
    cursor: pointer;
    backdrop-filter: blur(var(--glass-blur));
    transition: transform 0.36s var(--ease-float), border-color 0.25s var(--ease-silk);
  }

  .note-card:active {
    transform: scale(0.98);
  }

  .note-card.pressing {
    transform: scale(0.965);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .note-card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .note-card-preview {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-card-meta {
    font-size: 11px;
    color: var(--text-secondary);
    opacity: 0.75;
    margin-top: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-secondary);
    font-size: 13.5px;
  }

  /* ANDROID 17 FLOATING ACTION SHEET */
  .a17-backdrop {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(3, 4, 7, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
    transition: opacity 0.42s var(--ease-float), background 0.45s var(--ease-float), backdrop-filter 0.45s var(--ease-float);
  }

  .a17-backdrop.open {
    opacity: 1;
    pointer-events: auto;
    background: rgba(3, 4, 7, 0.52);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .a17-sheet {
    width: 100%;
    max-width: 516px;
    background: rgba(16, 19, 28, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 30px;
    padding: 16px 18px 20px;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(34px);
    -webkit-backdrop-filter: blur(34px);
    transform: translateY(36px) scale(0.94);
    opacity: 0;
    transition: transform 0.56s var(--ease-float), opacity 0.36s var(--ease-silk);
  }

  .a17-backdrop.open .a17-sheet {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .sheet-handle {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 auto 12px;
  }

  .sheet-title {
    font-size: 17px;
    font-weight: 700;
  }

  .sheet-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-bottom: 14px;
  }

  .primary-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--btn-active-bg);
    border-radius: 15px;
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  .danger-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid rgba(248, 113, 113, 0.45);
    border-radius: 15px;
    background: rgba(248, 113, 113, 0.15);
    color: var(--danger);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }

  .secondary-btn {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--btn-border);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--btn-text);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(18px) scale(0.95);
    background: rgba(14, 17, 24, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: var(--text-primary);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s var(--ease-float), opacity 0.32s var(--ease-silk);
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
</style>
</head>
<body>
<div class="wallpaper-layer"></div>
<div class="wallpaper-dim"></div>

<div class="app-shell">
  <!-- FULLSCREEN EDITOR VIEW -->
  <section id="viewEditor" class="view active">
    <div class="editor-topbar">
      <button type="button" class="pill-btn" onclick="openNotesList()">Notes</button>
      <span class="status-chip" id="filePathLabel">/storage/emulated/0/LifeNotes</span>
      <button type="button" class="pill-btn save-btn" onclick="saveCurrentNote()">Save</button>
    </div>

    <div class="editor-title-wrap">
      <input type="text" id="noteTitleInput" class="title-input" placeholder="Note title (becomes .txt file)..." autocomplete="off">
    </div>

    <div class="editor-body-wrap">
      <textarea id="noteBodyInput" class="note-textarea" placeholder="Start writing your note..."></textarea>
    </div>
  </section>

  <!-- SAVED NOTES LIST VIEW -->
  <section id="viewList" class="view">
    <div class="list-header">
      <div>
        <h1>Saved Notes</h1>
        <p>/storage/emulated/0/LifeNotes</p>
      </div>
      <button type="button" class="pill-btn save-btn" onclick="newNote()">+ New</button>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search notes..." oninput="renderNotesList()">
    </div>

    <div class="notes-scroll" id="notesListContainer"></div>
  </section>
</div>

<!-- LONG-PRESS ACTION SHEET -->
<div id="actionModal" class="a17-backdrop" onclick="if(event.target.id==='actionModal') closeActionModal()">
  <div class="a17-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="actionTitle">Note</div>
    <div class="sheet-sub" id="actionSub">.txt file</div>
    <button type="button" class="primary-btn" id="actionOpenBtn">Open & Edit</button>
    <button type="button" class="danger-btn" id="actionDeleteBtn">Delete File</button>
    <button type="button" class="secondary-btn" onclick="closeActionModal()">Cancel</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const FALLBACK_KEY = "lifenotes_fallback_v1";
  let currentFileName = "";
  let notesCache = [];

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  function sanitizeFileName(rawTitle) {
    const cleaned = (rawTitle || "Untitled")
      .trim()
      .replace(/[\\/:*?"<>|]+/g, "_")
      .replace(/\s+/g, " ")
      .slice(0, 80);
    return (cleaned || "Untitled") + ".txt";
  }

  function hasNativeBridge() {
    return typeof window.AndroidNotes !== "undefined";
  }

  function loadFallbackNotes() {
    try {
      return JSON.parse(localStorage.getItem(FALLBACK_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveFallbackNotes(list) {
    try {
      localStorage.setItem(FALLBACK_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function refreshNotesFromStorage() {
    if (hasNativeBridge()) {
      try {
        const raw = window.AndroidNotes.listNotes();
        notesCache = JSON.parse(raw || "[]");
        return;
      } catch (e) {}
    }
    notesCache = loadFallbackNotes();
  }

  function saveCurrentNote() {
    const titleInput = document.getElementById("noteTitleInput");
    const bodyInput = document.getElementById("noteBodyInput");
    const rawTitle = titleInput.value.trim() || "Untitled";
    const content = bodyInput.value;
    const newFileName = sanitizeFileName(rawTitle);

    if (hasNativeBridge()) {
      try {
        if (currentFileName && currentFileName !== newFileName) {
          window.AndroidNotes.deleteNote(currentFileName);
        }
        const ok = window.AndroidNotes.saveNote(newFileName, content);
        if (ok) {
          currentFileName = newFileName;
          document.getElementById("filePathLabel").textContent = "/LifeNotes/" + newFileName;
          refreshNotesFromStorage();
          showToast("Saved: " + newFileName);
          return;
        }
      } catch (e) {
        showToast("Storage write failed");
        return;
      }
    }

    // Browser / fallback mode
    let list = loadFallbackNotes().filter(n => n.fileName !== currentFileName && n.fileName !== newFileName);
    list.unshift({
      fileName: newFileName,
      title: rawTitle,
      content,
      updatedAt: new Date().toLocaleString()
    });
    saveFallbackNotes(list);
    notesCache = list;
    currentFileName = newFileName;
    document.getElementById("filePathLabel").textContent = "/LifeNotes/" + newFileName;
    showToast("Saved: " + newFileName);
  }

  function newNote() {
    currentFileName = "";
    document.getElementById("noteTitleInput").value = "";
    document.getElementById("noteBodyInput").value = "";
    document.getElementById("filePathLabel").textContent = "/storage/emulated/0/LifeNotes";
    switchView("viewEditor");
    setTimeout(() => document.getElementById("noteTitleInput").focus(), 120);
  }

  function openNoteByFileName(fileName) {
    let content = "";
    if (hasNativeBridge()) {
      try {
        content = window.AndroidNotes.readNote(fileName) || "";
      } catch (e) {}
    } else {
      const found = loadFallbackNotes().find(n => n.fileName === fileName);
      content = found ? found.content : "";
    }

    currentFileName = fileName;
    document.getElementById("noteTitleInput").value = fileName.replace(/\.txt$/i, "");
    document.getElementById("noteBodyInput").value = content;
    document.getElementById("filePathLabel").textContent = "/LifeNotes/" + fileName;
    switchView("viewEditor");
  }

  function deleteNoteByFileName(fileName) {
    if (hasNativeBridge()) {
      try {
        window.AndroidNotes.deleteNote(fileName);
      } catch (e) {}
    } else {
      saveFallbackNotes(loadFallbackNotes().filter(n => n.fileName !== fileName));
    }
    if (currentFileName === fileName) {
      newNote();
    }
    refreshNotesFromStorage();
    renderNotesList();
    showToast("Deleted: " + fileName);
  }

  function switchView(viewId) {
    ["viewEditor", "viewList"].forEach(id => {
      document.getElementById(id).classList.toggle("active", id === viewId);
    });
  }

  function openNotesList() {
    refreshNotesFromStorage();
    renderNotesList();
    switchView("viewList");
  }

  function attachLongPress(el, onTap, onLongPress) {
    let timer = null;
    let longTriggered = false;
    let sx = 0, sy = 0;

    const clear = () => {
      clearTimeout(timer);
      el.classList.remove("pressing");
    };

    el.addEventListener("pointerdown", (e) => {
      longTriggered = false;
      sx = e.clientX;
      sy = e.clientY;
      el.classList.add("pressing");
      timer = setTimeout(() => {
        longTriggered = true;
        el.classList.remove("pressing");
        if (navigator.vibrate) navigator.vibrate(20);
        onLongPress();
      }, 480);
    });

    el.addEventListener("pointermove", (e) => {
      if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clear();
    });

    el.addEventListener("pointerup", () => {
      const wasLong = longTriggered;
      clear();
      if (!wasLong && onTap) onTap();
    });

    el.addEventListener("pointercancel", clear);
    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      clear();
      onLongPress();
    });
  }

  function closeActionModal() {
    document.getElementById("actionModal").classList.remove("open");
  }

  function openActionModal(note) {
    document.getElementById("actionTitle").textContent = note.title || note.fileName;
    document.getElementById("actionSub").textContent = "/storage/emulated/0/LifeNotes/" + note.fileName;
    document.getElementById("actionOpenBtn").onclick = () => {
      closeActionModal();
      openNoteByFileName(note.fileName);
    };
    document.getElementById("actionDeleteBtn").onclick = () => {
      closeActionModal();
      deleteNoteByFileName(note.fileName);
    };
    requestAnimationFrame(() => document.getElementById("actionModal").classList.add("open"));
  }

  function renderNotesList() {
    const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
    const container = document.getElementById("notesListContainer");
    container.innerHTML = "";

    const filtered = notesCache.filter(n =>
      (n.fileName || "").toLowerCase().includes(q) ||
      (n.content || "").toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state">No .txt notes found in /storage/emulated/0/LifeNotes</div>';
      return;
    }

    filtered.forEach(note => {
      const card = document.createElement("div");
      card.className = "note-card";
      const displayTitle = (note.fileName || "Untitled.txt").replace(/\.txt$/i, "");
      card.innerHTML = `
        <div class="note-card-title">${displayTitle}</div>
        <div class="note-card-preview">${(note.content || "").trim() || "Empty file"}</div>
        <div class="note-card-meta">${note.fileName}${note.updatedAt ? " • " + note.updatedAt : ""}</div>
      `;
      attachLongPress(
        card,
        () => openNoteByFileName(note.fileName),
        () => openActionModal({ ...note, title: displayTitle })
      );
      container.appendChild(card);
    });
  }

  refreshNotesFromStorage();
</script>
</body>
</html>
