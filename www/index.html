<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Life Notes</title>
<style>
  :root {
    --bg-base: #06070a;
    --card-color: #ffffff;
    --card-alpha: 0.08;
    --glass-blur: 24px;
    --border-color: #ffffff;
    --border-alpha: 0.16;

    --text-primary: #ffffff;
    --text-secondary: #a1a1aa;

    --btn-border: rgba(255, 255, 255, 0.22);
    --btn-active-bg: #ffffff;
    --btn-active-text: #06070a;
    --danger: #f87171;

    --ease-float: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-silk: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  .wallpaper-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(255, 255, 255, 0.06) 0%, transparent 45%),
      var(--bg-base);
    pointer-events: none;
  }

  .wallpaper-dim {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
  }

  button, input, textarea {
    font-family: inherit;
    touch-action: manipulation;
  }

  button {
    transition: transform 0.3s var(--ease-float), background 0.24s var(--ease-silk), color 0.24s var(--ease-silk), border-color 0.24s var(--ease-silk);
  }

  button:active {
    transform: scale(0.95);
  }

  .app-shell {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 14px);
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }

  .view {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .view.active {
    display: flex;
    animation: floatIn 0.42s var(--ease-float) both;
  }

  @keyframes floatIn {
    0% {
      opacity: 0;
      transform: translateY(10px) scale(0.99);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .pill-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--btn-border);
    color: var(--text-primary);
    padding: 8px 15px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .pill-btn.active-btn {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
    font-weight: 700;
  }

  .path-chip {
    flex: 1;
    font-size: 11.5px;
    color: var(--text-secondary);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* FULLSCREEN EDITOR */
  .title-wrap {
    padding: 12px 16px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .title-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }

  .title-input::placeholder {
    color: rgba(255, 255, 255, 0.34);
  }

  .body-wrap {
    flex: 1;
    min-height: 0;
    padding: 12px 16px 14px;
    display: flex;
  }

  .note-textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-size: 15.5px;
    line-height: 1.6;
  }

  .note-textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  /* NOTES LIST */
  .search-wrap {
    padding: 10px 14px 6px;
  }

  .search-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--btn-border);
    border-radius: 15px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
  }

  .notes-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .note-card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    padding: 14px 16px;
    cursor: pointer;
    transition: transform 0.28s var(--ease-float), border-color 0.22s var(--ease-silk);
  }

  .note-card:active {
    transform: scale(0.98);
  }

  .note-card.pressing {
    transform: scale(0.965);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .note-card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .note-card-preview {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-card-meta {
    font-size: 11px;
    color: var(--text-secondary);
    opacity: 0.75;
    margin-top: 7px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: var(--text-secondary);
    font-size: 13.5px;
  }

  /* ANDROID 17 FLOATING ACTION SHEET */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(3, 4, 7, 0);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
    transition: opacity 0.34s var(--ease-silk), background 0.34s var(--ease-silk);
  }

  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
    background: rgba(3, 4, 7, 0.65);
  }

  .sheet-card {
    width: 100%;
    max-width: 500px;
    background: #12151e;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 28px;
    padding: 16px 18px 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.78);
    transform: translateY(30px) scale(0.96);
    opacity: 0;
    transition: transform 0.44s var(--ease-float), opacity 0.28s var(--ease-silk);
  }

  .sheet-backdrop.open .sheet-card {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .sheet-handle {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 auto 12px;
  }

  .sheet-title {
    font-size: 16px;
    font-weight: 700;
  }

  .sheet-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-bottom: 14px;
  }

  .sheet-btn {
    width: 100%;
    padding: 13px;
    border-radius: 15px;
    border: 1px solid var(--btn-border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }

  .sheet-btn.primary {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    border-color: var(--btn-active-bg);
    font-weight: 700;
  }

  .sheet-btn.danger {
    color: var(--danger);
    border-color: rgba(248, 113, 113, 0.45);
    background: rgba(248, 113, 113, 0.14);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: rgba(16, 19, 27, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: var(--text-primary);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.36s var(--ease-float), opacity 0.26s var(--ease-silk);
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="wallpaper-layer"></div>
<div class="wallpaper-dim"></div>

<div class="app-shell">
  <!-- FULLSCREEN EDITOR -->
  <section id="viewEditor" class="view active">
    <div class="topbar">
      <button type="button" class="pill-btn" id="btnShowList">Notes</button>
      <span class="path-chip" id="pathLabel">/storage/emulated/0/LifeNotes</span>
      <button type="button" class="pill-btn active-btn" id="btnSaveNote">Save</button>
    </div>

    <div class="title-wrap">
      <input type="text" id="noteTitle" class="title-input" placeholder="Note title (saves as .txt)..." autocomplete="off">
    </div>

    <div class="body-wrap">
      <textarea id="noteBody" class="note-textarea" placeholder="Write your note here..."></textarea>
    </div>
  </section>

  <!-- SAVED NOTES LIST -->
  <section id="viewList" class="view">
    <div class="topbar">
      <button type="button" class="pill-btn" id="btnBackEditor">Editor</button>
      <span class="path-chip">/storage/emulated/0/LifeNotes</span>
      <button type="button" class="pill-btn active-btn" id="btnNewNote">+ New</button>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Search saved notes...">
    </div>

    <div class="notes-list" id="notesList"></div>
  </section>
</div>

<!-- LONG PRESS ACTION SHEET -->
<div id="actionSheet" class="sheet-backdrop">
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Note</div>
    <div class="sheet-sub" id="sheetSub">/storage/emulated/0/LifeNotes</div>
    <button type="button" class="sheet-btn primary" id="sheetOpenBtn">Open & Edit</button>
    <button type="button" class="sheet-btn danger" id="sheetDeleteBtn">Delete File</button>
    <button type="button" class="sheet-btn" id="sheetCancelBtn">Cancel</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  (function () {
    const FALLBACK_KEY = "lifenotes_v3_store";
    let currentFile = "";
    let selectedFile = "";
    let notesCache = [];

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove("show"), 2000);
    }

    function sanitizeFileName(raw) {
      const clean = (raw || "Untitled")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "_")
        .replace(/\s+/g, " ")
        .slice(0, 80);
      return (clean || "Untitled") + ".txt";
    }

    function getBridge() {
      return window.AndroidNotes && typeof window.AndroidNotes.saveNote === "function"
        ? window.AndroidNotes
        : null;
    }

    function readFallback() {
      try {
        return JSON.parse(localStorage.getItem(FALLBACK_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function writeFallback(arr) {
      try {
        localStorage.setItem(FALLBACK_KEY, JSON.stringify(arr));
      } catch (e) {}
    }

    function syncNotes() {
      const bridge = getBridge();
      if (bridge) {
        try {
          notesCache = JSON.parse(bridge.listNotes() || "[]");
          return;
        } catch (e) {}
      }
      notesCache = readFallback();
    }

    function switchView(id) {
      document.getElementById("viewEditor").classList.toggle("active", id === "viewEditor");
      document.getElementById("viewList").classList.toggle("active", id === "viewList");
    }

    function saveNote() {
      const rawTitle = document.getElementById("noteTitle").value.trim() || "Untitled";
      const content = document.getElementById("noteBody").value;
      const fileName = sanitizeFileName(rawTitle);
      const bridge = getBridge();

      if (bridge) {
        if (currentFile && currentFile !== fileName) {
          bridge.deleteNote(currentFile);
        }
        const ok = bridge.saveNote(fileName, content);
        if (ok) {
          currentFile = fileName;
          document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
          syncNotes();
          showToast("Saved: " + fileName);
        } else {
          showToast("Permission needed to save file");
        }
        return;
      }

      const list = readFallback().filter(n => n.fileName !== currentFile && n.fileName !== fileName);
      list.unshift({
        fileName,
        content,
        updatedAt: new Date().toLocaleString()
      });
      writeFallback(list);
      notesCache = list;
      currentFile = fileName;
      document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
      showToast("Saved: " + fileName);
    }

    function openNote(fileName) {
      const bridge = getBridge();
      let text = "";
      if (bridge) {
        text = bridge.readNote(fileName) || "";
      } else {
        const found = readFallback().find(n => n.fileName === fileName);
        text = found ? found.content : "";
      }
      currentFile = fileName;
      document.getElementById("noteTitle").value = fileName.replace(/\.txt$/i, "");
      document.getElementById("noteBody").value = text;
      document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
      switchView("viewEditor");
    }

    function resetEditor() {
      currentFile = "";
      document.getElementById("noteTitle").value = "";
      document.getElementById("noteBody").value = "";
      document.getElementById("pathLabel").textContent = "/storage/emulated/0/LifeNotes";
      switchView("viewEditor");
    }

    function deleteNote(fileName) {
      const bridge = getBridge();
      if (bridge) {
        bridge.deleteNote(fileName);
        syncNotes();
      } else {
        const updated = readFallback().filter(n => n.fileName !== fileName);
        writeFallback(updated);
        notesCache = updated;
      }
      if (currentFile === fileName) {
        resetEditor();
      }
      renderList();
      showToast("Deleted: " + fileName);
    }

    function openActionSheet(fileName) {
      selectedFile = fileName;
      document.getElementById("sheetTitle").textContent = fileName.replace(/\.txt$/i, "");
      document.getElementById("sheetSub").textContent = "/storage/emulated/0/LifeNotes/" + fileName;
      requestAnimationFrame(() => document.getElementById("actionSheet").classList.add("open"));
    }

    function closeActionSheet() {
      document.getElementById("actionSheet").classList.remove("open");
    }

    function renderList() {
      syncNotes();
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const wrap = document.getElementById("notesList");
      wrap.innerHTML = "";

      const filtered = notesCache.filter(item =>
        (item.fileName || "").toLowerCase().includes(q) ||
        (item.content || "").toLowerCase().includes(q)
      );

      if (!filtered.length) {
        wrap.innerHTML = '<div class="empty-state">No .txt notes found in /storage/emulated/0/LifeNotes</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "note-card";
        const displayTitle = (item.fileName || "Untitled.txt").replace(/\.txt$/i, "");
        card.innerHTML = `
          <div class="note-card-title">${displayTitle}</div>
          <div class="note-card-preview">${(item.content || "").trim() || "Empty note"}</div>
          <div class="note-card-meta">${item.fileName}${item.updatedAt ? " • " + item.updatedAt : ""}</div>
        `;

        let pressTimer = null;
        let longPressed = false;
        let sx = 0, sy = 0;

        const clearPress = () => {
          clearTimeout(pressTimer);
          card.classList.remove("pressing");
        };

        card.addEventListener("pointerdown", (e) => {
          longPressed = false;
          sx = e.clientX;
          sy = e.clientY;
          card.classList.add("pressing");
          pressTimer = setTimeout(() => {
            longPressed = true;
            card.classList.remove("pressing");
            if (navigator.vibrate) navigator.vibrate(25);
            openActionSheet(item.fileName);
          }, 450);
        });

        card.addEventListener("pointermove", (e) => {
          if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) clearPress();
        });

        card.addEventListener("pointerup", () => {
          const wasLong = longPressed;
          clearPress();
          if (!wasLong) openNote(item.fileName);
        });

        card.addEventListener("pointercancel", clearPress);
        card.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          clearPress();
          openActionSheet(item.fileName);
        });

        wrap.appendChild(card);
      });
    }

    document.getElementById("btnSaveNote").addEventListener("click", saveNote);
    document.getElementById("btnShowList").addEventListener("click", () => {
      renderList();
      switchView("viewList");
    });
    document.getElementById("btnBackEditor").addEventListener("click", () => switchView("viewEditor"));
    document.getElementById("btnNewNote").addEventListener("click", resetEditor);
    document.getElementById("searchInput").addEventListener("input", renderList);

    document.getElementById("sheetOpenBtn").addEventListener("click", () => {
      const f = selectedFile;
      closeActionSheet();
      openNote(f);
    });
    document.getElementById("sheetDeleteBtn").addEventListener("click", () => {
      const f = selectedFile;
      closeActionSheet();
      deleteNote(f);
    });
    document.getElementById("sheetCancelBtn").addEventListener("click", closeActionSheet);
    document.getElementById("actionSheet").addEventListener("click", (e) => {
      if (e.target.id === "actionSheet") closeActionSheet();
    });

    syncNotes();
  })();
</script>
</body>
</html>
