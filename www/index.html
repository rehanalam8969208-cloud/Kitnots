<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Life Notes</title>
<style>
  :root {
    --bg: #06070a;
    --card: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.18);
    --text: #ffffff;
    --muted: #a1a1aa;
    --active-bg: #ffffff;
    --active-text: #06070a;
    --danger: #f87171;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    overflow: hidden;
  }

  .app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 12px);
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }

  .view {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
  }

  .view.active {
    display: flex;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn.primary {
    background: var(--active-bg);
    color: var(--active-text);
    border-color: var(--active-bg);
    font-weight: 700;
  }

  .path-label {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-box {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .title-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 19px;
    font-weight: 700;
  }

  .body-box {
    flex: 1;
    min-height: 0;
    padding: 12px 16px;
    display: flex;
  }

  .note-area {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.55;
  }

  .list-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .note-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    cursor: pointer;
  }

  .note-item-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .note-item-sub {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
    z-index: 999;
  }

  .sheet-backdrop.open {
    display: flex;
  }

  .sheet {
    width: 100%;
    max-width: 480px;
    background: #12151d;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sheet-btn {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .sheet-btn.del {
    color: var(--danger);
    border-color: rgba(248, 113, 113, 0.4);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #181c26;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    display: none;
    z-index: 1000;
  }

  .toast.show {
    display: block;
  }
</style>
</head>
<body>
<div class="app">
  <!-- EDITOR -->
  <section id="editorView" class="view active">
    <div class="topbar">
      <button type="button" class="btn" id="btnNotes">Notes</button>
      <span class="path-label" id="pathLabel">/storage/emulated/0/LifeNotes</span>
      <button type="button" class="btn primary" id="btnSave">Save</button>
    </div>
    <div class="title-box">
      <input type="text" id="titleInput" class="title-input" placeholder="Title (saves as .txt)" autocomplete="off">
    </div>
    <div class="body-box">
      <textarea id="bodyInput" class="note-area" placeholder="Write your note here..."></textarea>
    </div>
  </section>

  <!-- LIST -->
  <section id="listView" class="view">
    <div class="topbar">
      <button type="button" class="btn" id="btnBackEditor">Editor</button>
      <span class="path-label">Saved .txt Notes</span>
      <button type="button" class="btn primary" id="btnNew">+ New</button>
    </div>
    <div class="list-wrap" id="listWrap"></div>
  </section>
</div>

<!-- LONG PRESS SHEET -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div id="sheetTitle" style="font-size:15px; font-weight:700;">Note</div>
    <button type="button" class="sheet-btn" id="sheetOpenBtn">Open</button>
    <button type="button" class="sheet-btn del" id="sheetDeleteBtn">Delete</button>
    <button type="button" class="sheet-btn" id="sheetCancelBtn">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    const STORAGE_KEY = "lifenotes_v2_items";
    let activeFileName = "";
    let selectedFileName = "";
    let notes = [];

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function makeTxtName(title) {
      const clean = (title || "Untitled")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "_")
        .slice(0, 80);
      return (clean || "Untitled") + ".txt";
    }

    function nativeBridge() {
      return window.AndroidNotes && typeof window.AndroidNotes.saveNote === "function"
        ? window.AndroidNotes
        : null;
    }

    function loadNotes() {
      const bridge = nativeBridge();
      if (bridge) {
        try {
          notes = JSON.parse(bridge.listNotes() || "[]");
          return;
        } catch (e) {}
      }
      try {
        notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        notes = [];
      }
    }

    function saveFallback() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      } catch (e) {}
    }

    function showView(id) {
      document.getElementById("editorView").classList.toggle("active", id === "editorView");
      document.getElementById("listView").classList.toggle("active", id === "listView");
    }

    function saveNote() {
      const rawTitle = document.getElementById("titleInput").value.trim() || "Untitled";
      const content = document.getElementById("bodyInput").value;
      const fileName = makeTxtName(rawTitle);
      const bridge = nativeBridge();

      if (bridge) {
        if (activeFileName && activeFileName !== fileName) {
          bridge.deleteNote(activeFileName);
        }
        const ok = bridge.saveNote(fileName, content);
        if (ok) {
          activeFileName = fileName;
          document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
          loadNotes();
          toast("Saved: " + fileName);
        } else {
          toast("Save failed — check file permission");
        }
        return;
      }

      notes = notes.filter(n => n.fileName !== activeFileName && n.fileName !== fileName);
      notes.unshift({ fileName, title: rawTitle, content });
      saveFallback();
      activeFileName = fileName;
      document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
      toast("Saved: " + fileName);
    }

    function openNote(fileName) {
      let text = "";
      const bridge = nativeBridge();
      if (bridge) {
        text = bridge.readNote(fileName) || "";
      } else {
        const found = notes.find(n => n.fileName === fileName);
        text = found ? found.content : "";
      }
      activeFileName = fileName;
      document.getElementById("titleInput").value = fileName.replace(/\.txt$/i, "");
      document.getElementById("bodyInput").value = text;
      document.getElementById("pathLabel").textContent = "/LifeNotes/" + fileName;
      showView("editorView");
    }

    function deleteNote(fileName) {
      const bridge = nativeBridge();
      if (bridge) {
        bridge.deleteNote(fileName);
        loadNotes();
      } else {
        notes = notes.filter(n => n.fileName !== fileName);
        saveFallback();
      }
      if (activeFileName === fileName) {
        activeFileName = "";
        document.getElementById("titleInput").value = "";
        document.getElementById("bodyInput").value = "";
        document.getElementById("pathLabel").textContent = "/storage/emulated/0/LifeNotes";
      }
      renderList();
      toast("Deleted: " + fileName);
    }

    function openSheet(fileName) {
      selectedFileName = fileName;
      document.getElementById("sheetTitle").textContent = fileName;
      document.getElementById("sheetBackdrop").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheetBackdrop").classList.remove("open");
    }

    function renderList() {
      loadNotes();
      const wrap = document.getElementById("listWrap");
      wrap.innerHTML = "";

      if (!notes.length) {
        wrap.innerHTML = '<div style="text-align:center; color:#a1a1aa; padding:32px;">No .txt files yet</div>';
        return;
      }

      notes.forEach(item => {
        const row = document.createElement("div");
        row.className = "note-item";
        row.innerHTML = `
          <div class="note-item-title">${item.fileName.replace(/\.txt$/i, "")}</div>
          <div class="note-item-sub">${(item.content || "").replace(/\n+/g, " ") || "Empty note"}</div>
        `;

        let pressTimer = null;
        let longPressed = false;

        row.addEventListener("pointerdown", () => {
          longPressed = false;
          pressTimer = setTimeout(() => {
            longPressed = true;
            openSheet(item.fileName);
          }, 450);
        });

        row.addEventListener("pointerup", () => {
          clearTimeout(pressTimer);
          if (!longPressed) openNote(item.fileName);
        });

        row.addEventListener("pointercancel", () => clearTimeout(pressTimer));
        row.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          clearTimeout(pressTimer);
          openSheet(item.fileName);
        });

        wrap.appendChild(row);
      });
    }

    document.getElementById("btnSave").addEventListener("click", saveNote);
    document.getElementById("btnNotes").addEventListener("click", () => {
      renderList();
      showView("listView");
    });
    document.getElementById("btnBackEditor").addEventListener("click", () => showView("editorView"));
    document.getElementById("btnNew").addEventListener("click", () => {
      activeFileName = "";
      document.getElementById("titleInput").value = "";
      document.getElementById("bodyInput").value = "";
      document.getElementById("pathLabel").textContent = "/storage/emulated/0/LifeNotes";
      showView("editorView");
    });

    document.getElementById("sheetOpenBtn").addEventListener("click", () => {
      const f = selectedFileName;
      closeSheet();
      openNote(f);
    });
    document.getElementById("sheetDeleteBtn").addEventListener("click", () => {
      const f = selectedFileName;
      closeSheet();
      deleteNote(f);
    });
    document.getElementById("sheetCancelBtn").addEventListener("click", closeSheet);
    document.getElementById("sheetBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "sheetBackdrop") closeSheet();
    });

    loadNotes();
  })();
</script>
</body>
</html>
